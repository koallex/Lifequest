<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<meta name="description" content="Life Quest — игровой трекер привычек: задания, навыки, достижения и награды">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Quest">
<title>Life Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&family=Press+Start+2P&display=swap">
<style>
:root{--bg:#eeeafc;--card:#fff;--ink:#241c4a;--mute:#6d6693;--line:#ddd8f3;--acc:#6d4aff;--acc2:#e6defe;--gold:#f0a500;--ok:#14a370;--warn:#e0524a;--h1:#5b3df5;--h2:#9b6bff;--sh:0 8px 28px rgba(70,45,160,.12);--f:"Nunito","Segoe UI",system-ui,sans-serif;--px:"Press Start 2P",ui-monospace,monospace;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#120d2c;--card:#1d1647;--ink:#eeeaff;--mute:#a59bd8;--line:#33296a;--acc:#a08aff;--acc2:#2d2370;--gold:#ffc83d;--ok:#3fd69b;--warn:#ff7d72;--h1:#3a2a9c;--h2:#6a3fd0;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#120d2c;--card:#1d1647;--ink:#eeeaff;--mute:#a59bd8;--line:#33296a;--acc:#a08aff;--acc2:#2d2370;--gold:#ffc83d;--ok:#3fd69b;--warn:#ff7d72;--h1:#3a2a9c;--h2:#6a3fd0;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 var(--f);color:var(--ink);background:radial-gradient(900px 500px at 10% -10%,var(--acc2),transparent 60%),var(--bg);background-attachment:fixed}
.app{max-width:1060px;margin:0 auto;padding:18px 14px 70px}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.brand{font:400 16px/1.4 var(--px)}
.sub{color:var(--mute);font-weight:600;text-transform:capitalize;font-size:14px}
.coin{background:var(--card);box-shadow:var(--sh);border-radius:99px;padding:6px 14px;font-weight:800}
.nav{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin-bottom:6px}
.nav button{border:0;background:var(--card);border-radius:99px;padding:8px 16px;font-weight:700;white-space:nowrap;box-shadow:0 2px 8px rgba(70,45,160,.08);transition:transform .15s}
.nav button:hover{transform:translateY(-2px)}
.nav button.on{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff}
.card{background:var(--card);border-radius:22px;padding:20px;box-shadow:var(--sh);margin-bottom:16px}
h2{font:800 18px/1.3 var(--f);margin:0 0 12px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;transition:transform .3s}
.hero.lu{animation:lu 1s}
@keyframes lu{30%{transform:scale(1.03);box-shadow:0 0 0 6px var(--gold)}}
.avatar{width:84px;height:84px;display:grid;place-items:center;font-size:46px;background:rgba(255,255,255,.18);border-radius:22px;animation:fl 3s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-4px)}}
.lvl{font:400 11px/1.6 var(--px);margin-bottom:8px}.lvl b{color:#ffd761;font-weight:400}
.xpbar{height:16px;background:rgba(255,255,255,.22);border-radius:99px;overflow:hidden}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd761,#ffb02e);border-radius:99px;transition:width .7s cubic-bezier(.2,.8,.2,1)}
.xpt{font-size:13px;opacity:.9;margin-top:4px}
.goal{grid-column:1/-1;font-size:13px;opacity:.95}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:8px 12px;width:100%;min-width:0}
.hero input{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.35);color:#fff}
.hero input::placeholder{color:rgba(255,255,255,.65)}
.g{display:grid;grid-template-columns:repeat(12,1fr);column-gap:16px}
.s7{grid-column:span 7}.s5{grid-column:span 5}.s6{grid-column:span 6}.s12{grid-column:span 12}
.page{display:none}.page.show{display:block;animation:in .35s}
@keyframes in{from{opacity:0;transform:translateY(10px)}}
.btn{border:0;border-radius:99px;background:var(--acc2);color:var(--acc);font-weight:700;padding:7px 16px;transition:transform .12s}
.btn:hover{transform:translateY(-1px)}.btn:active{transform:scale(.96)}
.btn.go{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff}
.btn.del{color:var(--warn);margin-left:auto}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.q{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;background:var(--card);border:0;border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 0 0 1px var(--line),0 2px 10px rgba(70,45,160,.08);transition:transform .15s}
.q:hover:not(:disabled){transform:translateY(-1px)}.q:disabled{opacity:.5;cursor:default}
.q.on{background:linear-gradient(90deg,var(--acc2),var(--card));box-shadow:0 0 0 2px var(--ok)}
.box{width:30px;height:30px;border:2px solid var(--line);border-radius:50%;display:grid;place-items:center;color:transparent;font-size:17px}
.q.on .box{background:var(--ok);border-color:var(--ok);color:#fff}
.q.pop .box{animation:pop .35s}
@keyframes pop{50%{transform:scale(1.35) rotate(12deg)}}
.q small,.sm{display:block;color:var(--mute);font-size:12px}
.wk,.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px;max-width:240px}
.wk i,.bar i{display:block;height:100%;background:var(--ok);transition:width .6s}
.r{font:800 12px var(--f);background:var(--acc2);color:var(--acc);padding:3px 10px;border-radius:99px;white-space:nowrap}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.dw{text-align:center;font-size:11px;color:var(--mute)}
.day{min-height:38px;border:2px solid transparent;border-radius:10px;background:color-mix(in srgb,var(--acc) calc(var(--h,0)*55%),var(--bg));font-weight:600;transition:transform .12s}
.day:hover{transform:scale(1.08)}
.day.o{opacity:.35}.day.t{border-color:var(--gold)}.day.s{background:var(--acc);color:#fff}
.rs{font-size:12px}
.mood button{font-size:24px;background:none;border:2px solid transparent;border-radius:10px;padding:2px 6px;transition:transform .15s}
.mood button:hover{transform:scale(1.2)}.mood button.on{border-color:var(--acc);background:var(--acc2)}
.chart{width:100%;height:auto;display:block}.chart text{fill:var(--mute);font-size:10px}
.chart rect{transform-box:fill-box;transform-origin:center bottom;animation:gr .6s backwards}
@keyframes gr{from{transform:scaleY(0)}}
.scroll{overflow-x:auto}
table{border-collapse:separate;border-spacing:0;min-width:100%}
th,td{padding:0;text-align:center;font-size:12px;color:var(--mute)}
th.d{min-width:30px;padding:4px 0}th.d.t{color:var(--acc);font-weight:800}
.nm{position:sticky;left:0;background:var(--card);text-align:left;padding:5px 8px 5px 0;min-width:140px;max-width:180px;color:var(--ink);font-size:14px;z-index:1}
.cell{width:26px;height:26px;margin:2px;border-radius:8px;border:1.5px solid var(--line);background:transparent;padding:0;display:inline-block;vertical-align:middle}
.cell.on{background:var(--ok);border-color:var(--ok)}.cell.t{border-color:var(--gold)}.cell:disabled{opacity:.3;cursor:default}
.item{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item:last-child{border:0}.item .m{flex:1;min-width:0}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:22px;flex:none}
.ed{border:0;background:var(--bg);color:var(--mute);border-radius:10px;width:34px;height:34px}.ed:hover{color:var(--acc)}
.radar{width:100%;max-width:380px;margin:0 auto;display:block}
.sk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.skc{border-radius:18px;padding:14px;background:var(--bg);border-left:6px solid var(--c);transition:transform .2s}
.skc:hover{transform:translateY(-3px) rotate(-.4deg)}
.skc .bar i{background:var(--c)}
.ach{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.a{border-radius:16px;background:var(--bg);padding:12px;text-align:center;font-size:13px;transition:transform .2s}
.a:hover{transform:scale(1.04)}
.a span{display:block;font-size:32px}.a.off span{filter:grayscale(1);opacity:.5}
.a.on{background:var(--acc2);box-shadow:0 0 0 2px var(--gold)}
.a .bar{margin:6px auto 0}
.fly{position:fixed;z-index:20;font-weight:800;color:var(--gold);pointer-events:none;text-shadow:0 1px 3px rgba(0,0,0,.4)}
.cf{position:fixed;z-index:20;width:9px;height:9px;border-radius:2px;pointer-events:none}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--card);padding:10px 16px;border-radius:12px;font-weight:700;max-width:90vw;text-align:center;opacity:0;pointer-events:none;transition:opacity .3s;z-index:30}
#toast.show{opacity:1}
#toast{display:flex;align-items:center;justify-content:center;gap:12px}
.ti{font-size:36px;line-height:1;animation:pop .6s}
dialog{border:0;border-radius:22px;padding:22px;background:var(--card);color:var(--ink);box-shadow:var(--sh);width:min(420px,92vw)}
dialog::backdrop{background:rgba(20,10,50,.55)}
dialog label{display:block;font-size:14px;color:var(--mute);margin-bottom:12px}
.dact{display:flex;gap:8px;flex-wrap:wrap}
.empty{color:var(--mute);padding:8px 0}
@media (max-width:760px){.s7,.s5,.s6{grid-column:span 12}.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero>div{width:100%}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">LIFE QUEST</div><div class="sub" id="today"></div></div><div class="coin">🪙 <b id="coinTop">0</b></div></header>
  <section class="card hero" id="hero">
    <div class="avatar" id="av"></div>
    <div><div class="lvl" id="lvl"></div><div class="xpbar"><i id="xpb"></i></div><div class="xpt" id="xpt"></div></div>
    <label class="goal">Моя цель — зачем мне это<input id="goal" maxlength="90" placeholder="Например: больше энергии и спокойствия"></label>
  </section>
  <nav class="nav" aria-label="Разделы">
    <button data-p="home" class="on">Обзор</button><button data-p="tasks">Задания</button><button data-p="skills">Навыки</button><button data-p="ach">Достижения</button><button data-p="shop">Награды</button>
  </nav>

  <main>
  <div class="page show" id="p-home"><div class="g">
    <section class="card s7"><div class="row"><h2 id="qTitle"></h2><button class="btn" id="restB"></button></div><div id="quests"></div><div class="mood" id="mood" role="group" aria-label="Настроение"></div></section>
    <section class="card s5"><div class="row"><button class="btn" data-m="-1" aria-label="Предыдущий месяц">‹</button><h2 id="mName" style="margin:0;text-transform:capitalize"></h2><button class="btn" data-m="1" aria-label="Следующий месяц">›</button></div><div class="cal" id="cal" style="margin-top:12px"></div><p class="sm" style="margin-top:8px">Нажмите на день, чтобы увидеть или отметить его задания.</p></section>
    <section class="card s12"><h2>Опыт по дням месяца</h2><svg id="chart" class="chart" viewBox="0 0 620 170" role="img" aria-label="График опыта по дням"></svg></section>
  </div></div>

  <div class="page" id="p-tasks">
    <section class="card"><div class="row"><h2>Мои задания</h2><button class="btn go" id="addT">＋ Новое задание</button></div><div id="tlist"></div></section>
    <section class="card"><h2 id="gTitle" style="text-transform:capitalize"></h2><div class="scroll"><table id="grid"></table></div></section>
  </div>

  <div class="page" id="p-skills">
    <section class="card"><div class="row"><h2>Карта навыков</h2><button class="btn go" id="addS">＋ Новый навык</button></div><div id="radar"></div></section>
    <section class="card"><h2>Мои навыки</h2><div class="sk" id="slist"></div></section>
  </div>

  <div class="page" id="p-ach"><section class="card"><h2>Достижения</h2><div class="ach" id="alist"></div></section></div>

  <div class="page" id="p-shop">
    <section class="card"><div class="row"><h2>Магазин наград</h2><button class="btn go" id="addR">＋ Новая награда</button></div><p class="sm">Монеты вы получаете за выполненные задания. Тратьте их на то, что приятно именно вам.</p><div id="rlist"></div></section>
    <section class="card"><h2>История покупок</h2><div id="hist"></div></section>
  </div>
  </main>
</div>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
const KEY="life-quest-v2",$=i=>document.getElementById(i),RM=matchMedia("(prefers-reduced-motion:reduce)").matches;
const PAL=[["#ef5b6b","Красный"],["#4c8dff","Синий"],["#f0a500","Золотой"],["#9b6bff","Фиолетовый"],["#19b58a","Зелёный"],["#ff8a3d","Оранжевый"]];
const DIFF=[[1,"Лёгкая · 10 XP"],[2,"Средняя · 20 XP"],[3,"Трудная · 40 XP"]],XPV=[0,10,20,40];
const TOPT=[[7,"Каждый день"],[6,"6 раз в неделю"],[5,"5 раз в неделю"],[4,"4 раза в неделю"],[3,"3 раза в неделю"],[2,"2 раза в неделю"],[1,"1 раз в неделю"]];
const TITLES=["Новичок","Ученик","Искатель","Воин","Мастер","Герой","Легенда"],ICONS=["🥚","🐣","🧭","🛡️","⚔️","👑","🐉"],MOODS=["😫","😕","😐","🙂","🤩"];
function seed(){
  const s={skills:[{id:"s1",n:"Здоровье",i:"💪",c:PAL[0][0]},{id:"s2",n:"Работа",i:"💼",c:PAL[1][0]},{id:"s3",n:"Финансы",i:"💰",c:PAL[2][0]},{id:"s4",n:"Развитие",i:"📚",c:PAL[3][0]},{id:"s5",n:"Близкие",i:"❤️",c:PAL[4][0]}],
  tasks:[{id:"t1",name:"Прогулка или тренировка",skill:"s1",t:7,d:2},{id:"t2",name:"Прочитать 20 страниц",skill:"s4",t:7,d:2},{id:"t3",name:"Контроль расходов",skill:"s3",t:7,d:2},{id:"t4",name:"Главная рабочая задача",skill:"s2",t:7,d:3},{id:"t5",name:"Время с близкими",skill:"s5",t:7,d:2},{id:"t6",name:"Подвести итоги недели",skill:"s4",t:1,d:3}],
  done:{},rest:{},mood:{},ach:[],spent:[],goal:"",rewards:[{id:"r1",name:"Вечер любимого сериала",cost:50},{id:"r2",name:"Покупка для себя",cost:150},{id:"r3",name:"Выходной без обязательств",cost:300}]};
  try{const o=JSON.parse(localStorage.getItem("habit-tracker-v1"));if(o&&o.habits&&o.habits.length){s.tasks=o.habits.map(h=>({id:h.id,name:h.name,skill:"s4",t:h.t||7,d:2}));s.done=o.done||{};s.rest=o.rest||{};s.mood=o.mood||{};s.goal=o.goal||""}}catch(e){}
  return s;
}
let state=null;
try{const r=localStorage.getItem(KEY);if(r)state=JSON.parse(r)}catch(e){}
if(!state)state=seed();
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}};
const pad=n=>n<10?"0"+n:""+n,kd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parse=k=>{const p=k.split("-");return new Date(+p[0],+p[1]-1,+p[2])};
const wkStart=d=>{const x=new Date(d);x.setDate(x.getDate()-(x.getDay()+6)%7);return x};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const now=new Date();now.setHours(0,0,0,0);
const T=kd(now);let sel=T,view=new Date(now.getFullYear(),now.getMonth(),1),page="home",last=null;
const isDone=(k,id)=>(state.done[k]||[]).includes(id),xpOf=t=>XPV[t.d||2],skillOf=t=>state.skills.find(s=>s.id===t.skill);
const gl=L=>75*L*(L-1),sl=L=>40*L*(L-1),lvOf=(x,f)=>{let L=1;while(f(L+1)<=x)L++;return L};
function weekCount(id,date){const s=wkStart(date);let n=0;for(let i=0;i<7;i++){const d=new Date(s);d.setDate(s.getDate()+i);if(isDone(kd(d),id))n++}return n}
function streak(id){const d=new Date(now);let s=0,g=0;if(!isDone(T,id))d.setDate(d.getDate()-1);while(g++<2000){const k=kd(d);if(isDone(k,id))s++;else if(!state.rest[k])break;d.setDate(d.getDate()-1)}return s}
function calc(){
  const tk={},sk={},wks={},dayXp={};let xp=0,coins=0,tot=0,perfect=0,wk=0,best=0;
  state.tasks.forEach(t=>{tk[t.id]=t;if(t.t===7)best=Math.max(best,streak(t.id))});
  state.skills.forEach(s=>sk[s.id]={xp:0,n:0});
  for(const k in state.done){
    const a=state.done[k].filter(i=>tk[i]);let dx=0;
    a.forEach(i=>{const t=tk[i],x=xpOf(t);dx+=x;coins+=x/2;tot++;if(sk[t.skill]){sk[t.skill].xp+=x;sk[t.skill].n++}const q=i+"|"+kd(wkStart(parse(k)));wks[q]=(wks[q]||0)+1});
    if(state.tasks.length>=2&&a.length===state.tasks.length){perfect++;dx+=25;coins+=10}
    dayXp[k]=dx;xp+=dx;
  }
  for(const q in wks){if(wks[q]>=tk[q.split("|")[0]].t){wk++;xp+=30;coins+=15}}
  let topSk=1;for(const id in sk){const o=sk[id];o.lv=lvOf(o.xp,sl);o.lo=sl(o.lv);o.hi=sl(o.lv+1);topSk=Math.max(topSk,o.lv)}
  const lv=lvOf(xp,gl),spent=state.spent.reduce((a,b)=>a+b.cost,0);
  return {xp,coins:Math.round(coins)-spent,tot,perfect,wk,best,sk,dayXp,topSk,lv,lo:gl(lv),hi:gl(lv+1)};
}

function radar(anim){
